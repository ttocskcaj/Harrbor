<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:24px;display:flex;align-items:center;gap:32px}
.tile{background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:20px 24px;display:flex;align-items:center;gap:20px;box-shadow:var(--shadow-md)}
.cap{font:var(--text-2xs) var(--font-mono);color:var(--text-faint);margin-top:10px}</style></head>
<body>
<div><div class="tile"><img src="../assets/harrbor-mark.svg" width="56" height="56" alt="mark"></div><div class="cap">app icon · 56px</div></div>
<div><div class="tile" style="background:var(--slate-1000)"><img src="../assets/harrbor-wordmark.svg" height="40" alt="wordmark"></div><div class="cap">wordmark lockup</div></div>
</body></html>
