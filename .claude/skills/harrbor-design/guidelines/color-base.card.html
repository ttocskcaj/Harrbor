<!-- @dsCard group="Colors" viewport="700x190" name="Base · Slate/Navy ramp" subtitle="Backgrounds, surfaces, borders and text — deepest to brightest" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:20px}
.row{display:flex;gap:6px}
.sw{flex:1;height:66px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
.h{font:var(--text-2xs) var(--font-mono);color:var(--slate-300)}
.lbl{margin-top:10px;display:flex;gap:6px}
.lbl span{flex:1;font:var(--text-2xs) var(--font-mono);color:var(--text-faint);text-align:center}</style></head>
<body>
<div class="row">
<div class="sw" style="background:var(--slate-1000)"><span class="h">1000</span></div>
<div class="sw" style="background:var(--slate-950)"><span class="h">950</span></div>
<div class="sw" style="background:var(--slate-900)"><span class="h">900</span></div>
<div class="sw" style="background:var(--slate-850)"><span class="h">850</span></div>
<div class="sw" style="background:var(--slate-800)"><span class="h">800</span></div>
<div class="sw" style="background:var(--slate-700)"><span class="h">700</span></div>
<div class="sw" style="background:var(--slate-500)"><span class="h" style="color:var(--slate-100)">500</span></div>
<div class="sw" style="background:var(--slate-300)"><span class="h" style="color:var(--slate-1000)">300</span></div>
<div class="sw" style="background:var(--slate-100)"><span class="h" style="color:var(--slate-1000)">100</span></div>
</div>
<div class="lbl"><span>app</span><span>page</span><span>panel</span><span>card</span><span>inset</span><span>border</span><span>muted</span><span>2ndary</span><span>heading</span></div>
</body></html>
