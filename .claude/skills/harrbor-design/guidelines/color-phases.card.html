<!-- @dsCard group="Colors" viewport="700x150" name="Pipeline · Phase hues" subtitle="Cool→warm walk across the six phases" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:20px;display:flex;gap:6px}
.sw{flex:1;height:96px;border-radius:var(--radius-sm);display:flex;flex-direction:column;justify-content:space-between;padding:9px;box-sizing:border-box;border:1px solid var(--border-subtle)}
.dot{width:12px;height:12px;border-radius:3px}
.n{font:var(--fw-medium) var(--text-2xs) var(--font-sans);color:var(--slate-100)}
.h{font:9px var(--font-mono);color:var(--slate-400)}</style></head>
<body>
<div class="sw"><div class="dot" style="background:var(--phase-discover)"></div><div><div class="n">Discover</div><div class="h">#6b8fd6</div></div></div>
<div class="sw"><div class="dot" style="background:var(--phase-download)"></div><div><div class="n">Download</div><div class="h">#38b2c4</div></div></div>
<div class="sw"><div class="dot" style="background:var(--phase-transfer)"></div><div><div class="n">Transfer</div><div class="h">#2fb0a6</div></div></div>
<div class="sw"><div class="dot" style="background:var(--phase-import)"></div><div><div class="n">Import</div><div class="h">#5bbf7a</div></div></div>
<div class="sw"><div class="dot" style="background:var(--phase-cleanup)"></div><div><div class="n">Cleanup</div><div class="h">#c99a3a</div></div></div>
<div class="sw"><div class="dot" style="background:var(--phase-archival)"></div><div><div class="n">Archival</div><div class="h">#8a7bd8</div></div></div>
</body></html>
