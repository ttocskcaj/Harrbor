<!-- @dsCard group="Colors" viewport="700x150" name="Semantic · Status" subtitle="Health & pipeline states — ok, warn, error, info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:20px;display:flex;gap:12px}
.sw{flex:1;height:96px;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:9px 11px;box-sizing:border-box;border:1px solid var(--border-subtle)}
.n{font:var(--fw-semibold) var(--text-xs) var(--font-sans);color:#fff}
.h{font:var(--text-2xs) var(--font-mono);color:rgba(255,255,255,.72);margin-top:2px}</style></head>
<body>
<div class="sw" style="background:var(--green-500)"><div class="n">ok</div><div class="h">#34b877 · connected</div></div>
<div class="sw" style="background:var(--amber-500)"><div class="n" style="color:#2a1a00">warn</div><div class="h" style="color:rgba(42,26,0,.72)">#e0951c · stuck</div></div>
<div class="sw" style="background:var(--red-500)"><div class="n">error</div><div class="h">#e05656 · failed</div></div>
<div class="sw" style="background:var(--blue-500)"><div class="n">info</div><div class="h">#4d8ef0 · rare</div></div>
</body></html>
