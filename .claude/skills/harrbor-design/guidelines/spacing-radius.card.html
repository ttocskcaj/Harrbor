<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & elevation" subtitle="Restrained corners; deep, diffuse shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:22px;display:flex;gap:16px;align-items:center}
.b{width:78px;height:78px;background:var(--surface-card);border:1px solid var(--border-strong);display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;box-sizing:border-box}
.n{font:9px var(--font-mono);color:var(--text-muted)}</style></head>
<body>
<div class="b" style="border-radius:var(--radius-xs)"><span class="n">xs 3</span></div>
<div class="b" style="border-radius:var(--radius-sm)"><span class="n">sm 5</span></div>
<div class="b" style="border-radius:var(--radius-md)"><span class="n">md 7</span></div>
<div class="b" style="border-radius:var(--radius-lg)"><span class="n">lg 10</span></div>
<div style="width:1px;height:60px;background:var(--border-subtle)"></div>
<div class="b" style="border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"><span class="n">sm</span></div>
<div class="b" style="border-radius:var(--radius-md);box-shadow:var(--shadow-md)"><span class="n">md</span></div>
<div class="b" style="border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"><span class="n">lg</span></div>
</body></html>
