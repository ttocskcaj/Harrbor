<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

.b{background:var(--accent);border-radius:2px;width:14px}
.n{font:9px var(--font-mono);color:var(--text-faint)}</style></head>

<div class="c"><div class="b" style="height:24px"></div><div class="n">12</div></div>
<div class="c"><div class="b" style="height:32px"></div><div class="n">16</div></div>
<div class="c"><div class="b" style="height:40px"></div><div class="n">20</div></div>
<div class="c"><div class="b" style="height:48px"></div><div class="n">24</div></div>
<div class="c"><div class="b" style="height:64px"></div><div class="n">32</div></div>
<div class="c"><div class="b" style="height:80px"></div><div class="n">40</div></div>
</body></html>
