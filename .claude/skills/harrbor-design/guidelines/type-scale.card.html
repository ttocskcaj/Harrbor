<!-- @dsCard group="Type" viewport="700x210" name="Type scale" subtitle="IBM Plex Sans — hero to eyebrow" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-page);font-family:var(--font-sans);padding:22px;color:var(--text-heading)}
.r{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px solid var(--border-subtle)}
.r:last-child{border:0}
.t{font:9px var(--font-mono);color:var(--text-faint);width:70px;flex-shrink:0}</style></head>
<body>
<div class="r"><span class="t">4xl / 600</span><span style="font:var(--type-hero)">1,284 releases</span></div>
<div class="r"><span class="t">2xl / 600</span><span style="font:var(--type-title)">Pipeline overview</span></div>
<div class="r"><span class="t">xl / 600</span><span style="font:var(--type-heading)">Connection health</span></div>
<div class="r"><span class="t">lg / 500</span><span style="font:var(--type-card)">tv-shows lane</span></div>
<div class="r"><span class="t">base / 400</span><span style="font:var(--type-body);color:var(--text-body)">Moving completed downloads into the library.</span></div>
<div class="r"><span class="t">2xs / 600</span><span style="font:var(--type-eyebrow);color:var(--text-muted);letter-spacing:var(--tracking-caps);text-transform:uppercase">Attention required</span></div>
</body></html>
